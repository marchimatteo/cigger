<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIGGER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<div class="container pt-4">
    <div class="card mb-3">
        <div class="card-header">
            Visualizza CIG
        </div>
        <div class="card-body pb-2">
            <form id="form-see-cig">
                <div class="row">
                    <div class="col-md-auto col-2 mb-2">
                        <label for="input-cig-to-see" class="col-form-label">CIG</label>
                    </div>
                    <div class="col-md-auto col-10 mb-2">
                        <input
                            class="form-control"
                            type="text"
                            id="input-cig-to-see"
                            minlength="10"
                            maxlength="10"
                            autofocus
                            required
                        />
                    </div>
                    <div class="col-md-auto col-12 text-end">
                        <button type="submit" class="btn btn-primary mb-2" id="button-see-cig-put">
                            API PUT
                            <span class="spinner-border spinner-border-sm" role="status" id="button-see-cig-put-spinner" hidden></span>
                        </button>
                        <button type="submit" class="btn btn-primary mb-2" id="button-see-cig-bdncp">
                            BDNCP
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            Scarica CIG
        </div>
        <div class="card-body pb-0">
            <form id="form-get-cig">
                <dl class="row">
                    <dt class="col-md-2 mb-2">Stazioni appaltanti</dt>
                    <dd class="col-md-10">
                        <div class="row" id="row-input-stazione-to-add">
                            <div class="input-group">
                                <button class="btn btn-primary" type="button" id="button-add-stazione">Aggiungi</button>
                                <input
                                    type="text"
                                    id="input-stazione-to-add"
                                    class="form-control"
                                    placeholder="Inserisci il codice fiscale"
                                    aria-label="Aggiungi codice fiscale staizone appaltante"
                                >
                            </div>
                        </div>
                    </dd>
                </dl>

                <dl class="row">
                    <dt class="col-md-2 mb-2">Data di pubblicazione</dt>
                    <dd class="col-md-10">
                        <div class="row">
                            <div class="col-md-auto col-2 mb-2">
                                <label for="input-range-inizio" class="col-form-label">Da</label>
                            </div>
                            <div class="col-md-auto col-10 mb-2">
                                <input
                                        class="form-control"
                                        type="date"
                                        id="input-range-inizio"
                                        name="trip-start"
                                        max="9999-12-31"
                                        required
                                />
                            </div>
                            <div class="col-md-auto col-2 mb-2">
                                <label for="input-range-fine" class="col-form-label">A</label>
                            </div>
                            <div class="col-md-auto col-10 mb-2">
                                <input
                                        class="form-control"
                                        type="date"
                                        id="input-range-fine"
                                        name="trip-start"
                                        max="9999-12-31"
                                        required
                                />
                            </div>
                        </div>
                    </dd>
                </dl>

                <div class="row justify-content-center">
                    <div class="col-md-auto col-12 text-end">
                        <button type="submit" class="btn btn-primary" id="button-get-cig">
                            Recupera CIG
                            <span class="spinner-border spinner-border-sm" role="status" id="button-get-cig-spinner" hidden></span>
                        </button>
                        <button class="btn btn-secondary mb-2" disabled id="button-get-cig-new-new" hidden>Scarica excel</button>
                    </div>
                </div>

                <div class="progress my-3" role="progressbar" aria-label="Basic example" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: 0%" id="progress-bar"></div>
                </div>

                <div class="row">
                    <div class="col-4 text-center">
                        <p><strong>Da scaricare</strong></p>
                        <p id="counter-to-download">0</p>
                    </div>
                    <div class="col-4 text-center">
                        <p class="text-success"><strong>Scaricati</strong></p>
                        <p id="counter-downloaded">0</p>
                    </div>
                    <div class="col-4 text-center">
                        <p class="text-danger"><strong>In errore</strong></p>
                        <p id="counter-errored">0</p>
                    </div>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="lib/localforage.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script>
    /**
     * TODO:
     * Fa funzionare parte stazione appaltante (codici fiscali non inviati a _cigger.getData)
     * Fa funzionare pulsante scarica cig
     */

    window.onload = async (event) => {
        const moduleLogger = await import ('./logger.js');
        const logger = new moduleLogger.Logger();
        const moduleCigger = await import('./cigger.js');
        const cigger = new moduleCigger.Cigger(XLSX);
        const moduleAnacApi = await import('./anac-api.js');
        const api = new moduleAnacApi.AnacApi();
        const moduleUI = await import('./ui.js');
        const ui = new moduleUI.UI(cigger);
        const moduleStorageManager = await import ('./storage-manager.js');
        const storage = new moduleStorageManager.StorageManager(localforage);

        console.log(ui.getStazioniCF());
    }
</script>
</body>
</html>
